<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPM Security Scanner Pro</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>

<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand-block">
        <div class="brand-mark">NS</div>
        <div>
          <h1 class="brand-title">NPM Security Scanner</h1>
          <p class="brand-subtitle">Neo Security Console</p>
        </div>
      </div>

      <div class="header-controls">
        <div class="live-status">
          <span id="statusIndicator" class="status-indicator active"></span>
          <span id="toggleLabel" class="live-label">ON</span>
        </div>

        <label class="toggle-switch" aria-label="Toggle extension">
          <input type="checkbox" id="extensionToggle" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </header>

    <section class="status-strip" aria-live="polite">
      <div id="scanStatusText" class="status-chip">INITIALIZING...</div>
      <div id="targetUrl" class="target-url">Target: waiting for active tab...</div>
    </section>

    <section id="statsGrid" class="stats-grid" style="display: none;">
      <article class="stat-card">
        <p id="statPackages" class="stat-value">0</p>
        <p class="stat-label">Packages</p>
      </article>
      <article class="stat-card" id="statRiskCard">
        <p id="statRisks" class="stat-value">0</p>
        <p class="stat-label">Critical Risks</p>
      </article>
      <article class="stat-card" id="statFilesCard">
        <p id="statFiles" class="stat-value">0</p>
        <p class="stat-label">Exposed Files</p>
      </article>
    </section>

    <section id="actionControls" class="action-row" style="display: none;">
      <button id="rescanBtn" class="btn btn-primary" type="button">Rescan</button>
      <button id="copySummaryBtn" class="btn" type="button">Copy Summary</button>
      <button id="saveResultsBtn" class="btn" type="button">Save Results</button>
    </section>

    <section id="filterControls" class="filter-row" style="display: none;">
      <label class="field">
        <span class="field-label">Search</span>
        <input id="searchInput" type="search" placeholder="Package, source, reason, file..." autocomplete="off">
      </label>

      <label class="field">
        <span class="field-label">Severity</span>
        <select id="severityFilter">
          <option value="ALL">All</option>
          <option value="CRITICAL">Critical</option>
          <option value="HIGH">High</option>
          <option value="MEDIUM">Medium</option>
          <option value="LOW">Low</option>
          <option value="ERROR">Errors</option>
        </select>
      </label>
    </section>

    <main class="results-wrap">
      <div id="scanResults" class="scan-results">
        <div class="empty-state">
          <div class="empty-icon">_</div>
          <h2>Waiting for scan data</h2>
          <p>Open a target page and keep this popup open while scanning starts.</p>
        </div>
      </div>
    </main>

    <footer class="footer-meta">
      <span>
        Made by <a href="https://bugcrowd.com/h/Bytes_Knight" target="_blank" rel="noreferrer">@Bytes_Knight</a>
      </span>
      <span>
        <a href="https://github.com/bytes-Knight" target="_blank" rel="noreferrer">GitHub</a>
      </span>
    </footer>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="popup.js"></script>
</body>

</html>
